
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-infocare-frontend
  labels:
    app: pet-infocare
spec:
  replicas: 2 # Alta disponibilidade
  selector:
    matchLabels:
      app: pet-infocare
  template:
    metadata:
      labels:
        app: pet-infocare
    spec:
      containers:
      - name: frontend
        image: pet-infocare:latest # Substituir pelo registry correto (ex: ghcr.io/user/repo)
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: VITE_INSTANCE_NAME
          value: "Pet InfoCare K8s Cluster"
        - name: VITE_ENABLE_GOOGLE_AI
          value: "false" # IA desativada por padrão
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: pet-infocare-service
spec:
  selector:
    app: pet-infocare
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP
